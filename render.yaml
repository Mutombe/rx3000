# RX3000 — hosted deployment.
#
# This describes the *demonstration and evaluation* environment: the instance a
# prospective pharmacy is shown, and where the patient and prescriber portals
# are reachable from the public internet. It is not how a pharmacy runs its own
# till. That stays on the premises, on SQLite, working when the line is down —
# which in Zimbabwe is a requirement rather than a nicety.
#
# Two things follow from that distinction and are deliberate:
#
# * **Postgres, not SQLite.** Render's instance filesystem is ephemeral: a
#   deploy or a restart replaces it. A SQLite file there would silently lose
#   every sale since the last deploy, which is precisely the class of quiet data
#   loss this product exists to avoid. The application already reads
#   DATABASE_URL and branches on the driver, so this is configuration only.
#
# * **The secret is generated, never committed.** SECRET_KEY signs both staff
#   sessions and the patient portal links. A default committed to a public
#   repository would let anyone mint a link to any patient's record.

databases:
  - name: rx3000-db
    databaseName: rx3000
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: rx3000-api
    runtime: python
    plan: free
    region: frankfurt          # closest Render region to Zimbabwe
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rx3000-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true    # generated by Render, never in the repo
      - key: ENVIRONMENT
        value: demo
      # Not "production": the integration register refuses to run simulated
      # switches in production, and this environment has no live switch
      # agreements. Calling it production would either break the demo or,
      # worse, invite someone to trust a simulated claim response.
      - key: JURISDICTION
        value: ZW
      - key: PHARMACY_NAME
        value: RX3000 Demonstration Pharmacy
      - key: ALLOWED_ORIGINS
        # The browser calls the API from the static site's origin, which is a
        # different hostname. Without this every request is blocked by CORS.
        fromService:
          name: rx3000-app
          type: web
          property: host

  - type: web
    name: rx3000-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        # Baked in at build time by Vite. A relative /api path would 404 here,
        # because the API is a separate service on a separate hostname.
        fromService:
          name: rx3000-api
          type: web
          property: host
    # The staff app, the patient portal and the prescriber portal are all client
    # routes in one bundle, so every path must fall through to index.html or a
    # patient opening their link lands on a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        # Portal links carry a token in the path. Without this, following any
        # outbound link would hand that token to the destination site in the
        # Referer header.
        value: no-referrer

  - type: web
    name: rx3000-site
    runtime: static
    plan: free
    rootDir: landing
    buildCommand: ""           # a single self-contained file; nothing to build
    staticPublishPath: .
