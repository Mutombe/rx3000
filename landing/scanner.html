<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RX5000 Scanner</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141419">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="/scanner/">
<meta http-equiv="refresh" content="0; url=/scanner/">
<!--
  THE MISSING SLASH.

  Somebody standing at a counter types "rx5000.com/scanner" into a phone. They
  do not type the trailing slash; nobody types a trailing slash. What happened
  then was that the address did not match any file, the hosting's catch-all
  sent it to /index.html, and the person who wanted a camera got the marketing
  site — on the very first thing this product ever asks a new user to do.

  It was not a phone problem, although it looked exactly like one: it happens
  on any device, and the reason it seemed to work on a desktop is that a
  desktop browser had the address in its history WITH the slash and completed
  it. The scanner's own file has carried a note about this for a while, waiting
  on a redirect rule to be added in the hosting dashboard.

  This is that rule, as a file, so it lives with the code and nobody has to
  remember it. The host resolves an extensionless address to the .html file of
  the same name before it reaches the catch-all: /scanner therefore finds
  /scanner.html, which is this, and this sends the phone one door along to
  /scanner/, where the scanner actually is.

  WHY NOT MOVE THE SCANNER HERE AND BE DONE

  Because /scanner/ is the address printed in the application, on the pairing
  panel at every workstation, and in whatever QR codes and notes pharmacies
  have already made from it. That address has to keep working. This one has to
  start working. So the scanner stays where it is and this is a doormat.

  Three ways out, because the first two can be turned off: the meta refresh
  above fires without scripting, the script below fires first where scripting
  is on and carries any query string with it, and if a phone somehow does
  neither there is a link on the page to press.
-->
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/assets/inter-variable.woff2") format("woff2");
  }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px;
    background: #141419; color: #f4f3f1;
    font: 400 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: -0.01em; text-align: center;
  }
  a { color: #f4f3f1; }
</style>
</head>
<body>
  <p>Opening the scanner. <a href="/scanner/">Press here</a> if it does not.</p>
  <script>
    // Before the meta refresh, and replace() rather than assign() so the back
    // button goes where the person came from rather than back into this.
    location.replace("/scanner/" + location.search + location.hash);
  </script>
</body>
</html>
