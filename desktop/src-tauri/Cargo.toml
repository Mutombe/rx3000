[package]
name = "rx5000"
version = "1.3.1"
description = "RX3000 Pharmacy Suite"
authors = ["BitStudio"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
# A till is often an old machine on a slow disk. Size and startup matter more
# than the last few per cent of runtime speed.
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
