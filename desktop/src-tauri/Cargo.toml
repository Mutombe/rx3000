[package]
name = "rx5000"
version = "1.6.29"
description = "RX3000 Pharmacy Suite"
authors = ["BitStudio"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Lets a till fetch, verify and install a signed update
# rather than somebody reinstalling it by hand.
# The generated context references serde_json once tauri.conf.json carries
# plugin configuration, which it now does for the updater.
serde_json = "1"
# Already in the tree underneath Tauri; named here so this crate may use the
# derive directly, which is how a printer crosses to the web page as
# {name, driver, port} rather than as an array nothing can read.
serde = { version = "1", features = ["derive"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
# A till is often an old machine on a slow disk. Size and startup matter more
# than the last few per cent of runtime speed.
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
