# Build the till application for every platform a pharmacy might run it on.
#
# Windows is built on this laptop and committed to the site directly, because it
# is the platform every Zimbabwean pharmacy counter actually runs and waiting on
# CI to hand somebody an installer is a worse trade than 2.4 MB in the repository.
# Linux and macOS cannot be cross-compiled from Windows: a Tauri Linux bundle
# needs GTK and WebKitGTK headers on the build host, and a .dmg needs a Mac. So
# they are built here, on runners that have them.
#
# Triggered by a version tag, and by hand. A tag is the honest signal that a
# build is meant to be handed to somebody; building every push fills the
# releases page with binaries nobody asked for.
name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the installers to a release

jobs:
  build:
    strategy:
      fail-fast: false   # a Linux failure should not deny anybody the Mac build
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The Mac build is universal, so it needs both architectures.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build the front end
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "RX5000 __VERSION__"
          releaseBody: |
            The till application.

            Each build points at `http://localhost:8177` out of the box, which is
            the single-machine pharmacy. On a counter with its own server, put the
            address in `server.txt` beside the executable or set `RX5000_SERVER`;
            nothing needs rebuilding.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
